<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الروايات الشامل</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2d1b2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #4a2c4f; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); width: 400px; max-width: 90%; }
        h1 { color: #ff9ecb; font-size: 20px; text-align: center; margin-bottom: 10px; }
        .subtitle { color: #d8b4d4; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #f8c8dc; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #9d6b9d; background-color: #3a1f3d; color: #fff; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: #ff9ecb; }
        button { width: 100%; padding: 12px; background-color: #ec4899; border: none; border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #db2777; }
        #statusMessage { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>محول الروايات</h1>
        <p class="subtitle">التحميل من كل المواقع</p>

        <div class="form-group">
            <label for="novelUrl">رابط الرواية:</label>
            <input type="url" id="novelUrl" placeholder="ادخل الرابط الكامل هنا (https://...)" >
        </div>

        <div class="form-group">
            <label for="outputFormat">صيغة التحميل:</label>
            <select id="outputFormat">
                <option value="epub">كتاب إلكتروني (EPUB)</option>
                <option value="AZW3">كتاب كيندل (AZW3)</option>
                <option value="pdf">ملف مستند (PDF)</option>
                <option value="txt">ملف نص بسيط (TXT)</option>
                <option value="html">صفحة ويب مفرغة (HTML)</option>
            </select>
        </div>

        <button onclick="startConversion()">بدء التحويل</button>
        <div id="statusMessage"></div>
    </div>

    <script>
        async function startConversion() {
            const url = document.getElementById('novelUrl').value.trim();
            const format = document.getElementById('outputFormat').value;
            const statusDiv = document.getElementById('statusMessage');

            if (!url) {
                alert('الرجاء إدخال رابط الرواية أو الفانفيك');
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.style.background = '#ec4899';
            statusDiv.style.color = '#ffffff';
            statusDiv.innerText = '...جاري سحب الفصول وتجهيز الملف، يرجى الانتظار';

            try {
                const backendUrl = '/convert'; 

                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, format })
                });

                if (!response.ok) {
                    let errorMsg = 'فشل التحويل، تأكد من صحة الرابط';
                    try {
                        const errorData = await response.json();
                        if (errorData.error) errorMsg = errorData.error;
                    } catch (e) { }
                    throw new Error(errorMsg);
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                let extension = format.toLowerCase();
                if (format === "AZW3") {
                    extension = "azw3";
                }

                a.href = downloadUrl;
                a.download = `novel_converted.${extension}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                statusDiv.style.background = '#f9a8d4';
                statusDiv.style.color = '#3d1230';
                statusDiv.innerText = 'تم التحميل بنجاح!';
                
            } catch (error) {
                statusDiv.style.background = '#ff1d1d';
                statusDiv.style.color = '#fca5a5';
                statusDiv.innerText = `خطأ: ${error.message}`;
            }
        }
    </script>
</body>
</html>
